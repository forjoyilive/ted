name: Release builds

on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-15
    env:
      SIGNS: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 != '' }}
      NOTARIZES: ${{ secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write the App Store Connect API key
        if: ${{ env.NOTARIZES == 'true' }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
      - run: pnpm package --mac --x64 --arm64
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Check the signature and notarization
        if: ${{ env.SIGNS == 'true' }}
        run: |
          app=packages/app/dist/release/mac-arm64/Ted.app
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose "$app"
          xcrun stapler validate "$app"
      - name: Run the packaged ted command
        run: |
          export TED_HOME="$RUNNER_TEMP/ted-home" TED_IDLE_EXIT_MS=3000 TED_LOGIN_SHELL=off
          packages/app/dist/release/mac-arm64/Ted.app/Contents/Resources/bin/ted task list
      - uses: actions/upload-artifact@v4
        with:
          name: ted-mac
          path: |
            packages/app/dist/release/*.dmg
            packages/app/dist/release/*.zip
            packages/app/dist/release/*.blockmap
            packages/app/dist/release/latest-mac.yml

  linux:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: pnpm install --frozen-lockfile
      - run: pnpm package --linux --${{ matrix.arch }}
      - name: Install the deb and run /usr/bin/ted
        run: |
          sudo apt-get install -y ./packages/app/dist/release/*.deb
          export TED_HOME="$RUNNER_TEMP/ted-home" TED_IDLE_EXIT_MS=3000 TED_LOGIN_SHELL=off
          /usr/bin/ted task list
          sudo apt-get remove -y ted
          test ! -e /usr/bin/ted
      - name: Check the rpm installs /usr/bin/ted
        run: rpm -qp --scripts packages/app/dist/release/*.rpm | grep -q '/usr/bin/ted'
      - name: Run the ted command from the AppImage
        run: |
          appimage=$(ls packages/app/dist/release/*.AppImage)
          chmod +x "$appimage"
          export TED_HOME="$RUNNER_TEMP/ted-appimage-home" TED_IDLE_EXIT_MS=3000 TED_LOGIN_SHELL=off
          export APPIMAGE_EXTRACT_AND_RUN=1
          ELECTRON_RUN_AS_NODE=1 "$appimage" -e "const f = require('node:path').join(process.env.APPDIR, 'resources/app/packages/cli/src/main.js'); process.argv.splice(1, 0, f); import(require('node:url').pathToFileURL(f).href)" -- task list
      - uses: actions/upload-artifact@v4
        with:
          name: ted-linux-${{ matrix.arch }}
          path: |
            packages/app/dist/release/*.AppImage
            packages/app/dist/release/*.deb
            packages/app/dist/release/*.rpm
            packages/app/dist/release/latest-linux*.yml

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create a draft release with the update files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --draft --title "Ted ${TAG#v}" --notes ""
