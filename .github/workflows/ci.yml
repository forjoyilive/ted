name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @ted/app exec install-electron
      # Ubuntu runners block Chromium's OS sandbox; the renderer's own sandbox stays on.
      - run: xvfb-run -a pnpm test
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
