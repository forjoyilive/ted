release:
  name: Release
  powers: [ask, read_code, run_commands, run_outside]
  commands:
    typecheck: pnpm typecheck
    lint: pnpm lint
  outside_commands:
    build: pnpm release build <version>
    build-without-tests: pnpm release build <version> --skip-checks
    publish: pnpm release publish
    discard: pnpm release discard
