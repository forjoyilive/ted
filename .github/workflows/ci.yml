name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @ted/app exec install-electron
        if: startsWith(github.ref, 'refs/tags/v')
      # Ubuntu runners block Chromium's OS sandbox; the renderer's own sandbox stays on.
      - run: xvfb-run -a pnpm test
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
