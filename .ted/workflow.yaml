version: 1
repos:
  - name: ted
    remote: https://github.com/forjoyilive/ted.git
    merge_method: merge
    worktree:
      setup:
        run: >-
          pnpm install --frozen-lockfile &&
          electron_config_cache="$PWD/node_modules/.cache/electron" pnpm --filter @ted/app exec install-electron
        sandbox_access: [electron, network]
    apps:
      - name: Ted Dev
        kind: command
        electron: true
        sandbox_access: [network]
        run: MAC_CHROMIUM_TMPDIR="$TMPDIR" TED_HOME="$PWD/node_modules/.cache/ted-home" pnpm app $TED_ELECTRON_ARGS
      - name: Ted Dev Preview
        kind: command
        electron: true
        preview_only: true
        sandbox_access: [network]
        run: >-
          test -n "$TED_HOME" && test -n "$TED_KEYRING_MODULE" && test -n "$TED_RELAY_URL" &&
          MAC_CHROMIUM_TMPDIR="$TMPDIR" pnpm app $TED_ELECTRON_ARGS
  - name: ted-mobile
    remote: https://github.com/forjoyilive/ted-mobile.git
    merge_method: merge
    worktree:
      setup: { run: pnpm install --frozen-lockfile, sandbox_access: [ios-xcode, network] }
    apps:
      - name: Ted iPhone
        kind: ios-simulator
        run: pnpm ios release
        device: iPhone 17
        sandbox_access: [ios-xcode, network]
      - name: Ted Local Relay
        kind: web
        preview_only: true
        url: http://127.0.0.1:${PORT}/health
        run: >-
          test -n "$TED_PREVIEW_DIR" &&
          mkdir -p "$TED_PREVIEW_DIR/config" "$TED_PREVIEW_DIR/logs" &&
          XDG_CONFIG_HOME="$TED_PREVIEW_DIR/config"
          WRANGLER_LOG_PATH="$TED_PREVIEW_DIR/logs"
          WRANGLER_SEND_METRICS=false
          pnpm relay --ip 127.0.0.1 --port "$PORT"
          --persist-to "$TED_PREVIEW_DIR/state"
      - name: Ted Dev iPhone
        paired_preview: { desktop: Ted Dev Preview, relay: Ted Local Relay }
        kind: ios-simulator
        run: pnpm ios dev
        device: iPhone 17
        sandbox_access: [ios-xcode, network]
order: [intake, clarify, design, work, validate, review, merge]
stages:
  design: { gate: true, based_on: f7500a6 }
  work: { based_on: 31b5622 }
  validate:
    checks:
      - { name: Typecheck, run: pnpm typecheck }
      - { name: Lint, run: pnpm lint }
      - { name: Affected Tests, run: pnpm check --affected, timeout: 80m }
      - { name: Mobile Typecheck, run: pnpm typecheck, repo: ted-mobile }
      - { name: Mobile Lint, run: pnpm lint, repo: ted-mobile }
      - { name: Mobile Tests, run: pnpm test, repo: ted-mobile, timeout: 15m }
      - name: Docs drift
        fix: true
        instruction: >-
          Read the Task’s diff against its base. Find what it leaves wrong or missing in `GLOSSARY.md`, `AGENTS.md`, and `docs/agents/*.md` that the change touches: a rule, a term, a file path or a function name that no longer matches the code, or a new rule or term the change needs and no doc states. Fix each one with a doc edit, in its own commit, following the doc’s existing style and `AGENTS.md`’s writing rules. Don’t change the style of a doc, or any doc the change didn’t affect, and don’t edit code. Fail only for what a doc edit can’t fix, such as a contradiction between the change and a doc that needs a decision; name the doc and the line. Pass when there was nothing to fix or you fixed all of it, and list what you fixed.
  review: { enabled: false, gate: false }
  merge: { gate: false }
  clarify:
    enabled: true
    gate: false
    based_on: 90fe91d
  cleanup:
    enabled: true
    steps:
      - name: Stop leftovers
        instruction: >-
          Stop anything this Task started that Ted doesn’t track. End a Ted Dev daemon started with this worktree’s TED_HOME (`node_modules/.cache/ted-home`): `daemon.json` there names a PID, but the file can outlive the daemon and the PID can belong to another process by now, so kill it only after `ps` shows that PID is a Ted daemon using this exact TED_HOME. When you can’t confirm that, don’t kill it; report the step failed and say why. Also end a local relay the Task started with `pnpm relay` in `ted-mobile` (`wrangler dev`, usually on port 8787), and any Electron, browser or other process left running from the worktree, after confirming the same way that it is one, and remove temp files or folders the Task made outside the worktree. Ted stops the Task’s Apps and simulators and removes the worktree itself; leave those. Never touch `~/.ted`, `~/.ted-dev` or the user’s own checkout. Report skipped when there was nothing to stop.
      - name: Comment on the linked issue
        instruction: >-
          When the Task names a Linear, Asana or GitHub issue it came from or links to, comment on that issue with the merged pull request and one or two plain sentences on what shipped. Only use an issue the Task names; never search for a match. Report skipped when the Task names no issue.
      - name: File follow-ups
        instruction: >-
          File a Task with `ted task create` only for a real bug or missing behaviour this Task found and didn’t fix. Don’t file reviewer nits, design details, extra tests or docs wording. Before filing a test that failed on the base branch, check that it still fails on current `origin/main`; it is often fixed already. Skip anything a Task already covers (`ted peers`). Name each Task you filed in your final note. Report skipped when there is nothing to file.
