version: 1
repos:
  - name: ted
    remote: https://github.com/forjoyilive/ted.git
    merge_method: merge
    worktree:
      setup: pnpm install --frozen-lockfile
    apps:
      - name: Ted Dev
        kind: command
        electron: true
        run: MAC_CHROMIUM_TMPDIR="$TMPDIR" TED_HOME="$PWD/node_modules/.cache/ted-home" pnpm app $TED_ELECTRON_ARGS
order: [intake, clarify, design, work, validate, review, merge]
stages:
  design: { gate: true, based_on: f7500a6 }
  work: { based_on: d83680f }
  validate:
    checks:
      - { name: Typecheck, run: pnpm typecheck }
      - { name: Lint, run: pnpm lint }
      - { name: Affected Tests, run: pnpm check --affected, timeout: 80m }
  review: { enabled: false, gate: false }
  merge: { gate: false }
  clarify:
    enabled: true
    gate: false
    based_on: 9a50bb8
  cleanup:
    enabled: true
    steps:
      - name: Stop leftovers
        instruction: >-
          Stop anything this Task started that Ted doesn’t track. End a Ted Dev daemon started with this worktree’s TED_HOME (`node_modules/.cache/ted-home`): `daemon.json` there names a PID, but the file can outlive the daemon and the PID can belong to another process by now, so kill it only after `ps` shows that PID is a Ted daemon using this exact TED_HOME. When you can’t confirm that, don’t kill it; report the step failed and say why. Also end any Electron, browser or other process left running from the worktree, after confirming the same way that it is one, and remove temp files or folders the Task made outside the worktree. Ted stops the Task’s Apps and simulators and removes the worktree itself; leave those. Never touch `~/.ted`, `~/.ted-dev` or the user’s own checkout. Report skipped when there was nothing to stop.
      - name: Comment on the linked issue
        instruction: >-
          When the Task names a Linear, Asana or GitHub issue it came from or links to, comment on that issue with the merged pull request and one or two plain sentences on what shipped. Only use an issue the Task names; never search for a match. Start an Asana comment with a line naming your model. Report skipped when the Task names no issue.
      - name: File follow-ups
        instruction: >-
          Make sure every deferred finding, accepted failure, Validate note worth acting on and known gap from this Task is filed as a Task with `ted task create`, unless one already covers it (`ted peers`). Name each one in your final note. Report skipped when there is nothing to file.
